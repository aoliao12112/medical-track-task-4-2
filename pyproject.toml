[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medical-claims-insight"
version = "0.1.0"
description = "理赔医疗记录结构化与医疗事件重建原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "python-multipart>=0.0.12,<1",
  "httpx>=0.28,<1",
  "rapidocr>=3,<4",
  "onnxruntime>=1.20,<2",
]

[tool.setuptools.packages.find]
where = ["src"]
