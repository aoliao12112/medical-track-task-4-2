<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>理赔工作台 · 医护洞察与温度指引平台</title><link rel="stylesheet" href="/portal.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand-mark"><div class="brand-icon">＋</div><div class="brand-copy"><h1>医护洞察</h1><small>理赔工作区</small></div></div><nav>
<button class="nav-item active" data-view="home">⌂ <span class="nav-label">首页</span></button><button class="nav-item" data-view="cases">▤ <span class="nav-label">我的案件</span></button><button class="nav-item" data-view="tasks">✓ <span class="nav-label">我的待办</span></button><button class="nav-item" data-view="profile">○ <span class="nav-label">个人信息</span></button>
</nav></aside><div class="main-shell"><header class="topbar"><h2 id="topTitle">理赔工作台</h2><div class="user-box"><div class="user-copy"><strong id="userName">—</strong><small>理赔人员</small></div><button id="logoutButton" class="btn secondary">退出登录</button></div></header><main id="content" class="content"></main></div></div>
<div id="caseDialog" class="dialog-backdrop hidden"><form id="caseForm" class="dialog"><h2>代客户新建理赔案件</h2><p class="muted">适用于电话报案、线下材料、客服代录或历史数据迁移。必须先搜索并绑定已有客户。</p><div class="form-field"><label for="customerSearch">搜索已有客户</label><div class="inline-form"><input id="customerSearch" class="input" maxlength="200" placeholder="客户账号、姓名或手机号"><button type="button" id="searchCustomer" class="btn secondary">搜索</button></div></div><div class="form-field"><label for="customerUsername">选择客户</label><select id="customerUsername" class="input" required><option value="">请先搜索客户</option></select></div><div class="form-field"><label for="claimEventId">理赔事件编号</label><input id="claimEventId" class="input" required maxlength="200" placeholder="请输入报案号或真实业务编号"></div><div class="form-field"><label for="caseDataSource">建案来源</label><select id="caseDataSource" class="input"><option value="phone_report">电话报案</option><option value="offline_material">线下材料</option><option value="customer_service_entry">客服代录</option><option value="historical_migration">历史数据迁移</option></select></div><label class="checkbox"><input id="caseAuthorized" type="checkbox"><span>已有医疗材料，且已获得相关材料使用授权</span></label><label class="checkbox"><input id="caseDeidentified" type="checkbox"><span>已有医疗材料，且已遮盖姓名、证件号、手机号、住址、条码/二维码等身份信息</span></label><p class="muted">未勾选时会以“待确认”状态建案，后续补录材料前必须完成授权与脱敏确认。</p><p id="caseError" class="form-error"></p><div class="dialog-actions"><button type="button" id="cancelCase" class="btn secondary">取消</button><button type="submit" class="btn primary">代客户创建案件</button></div></form></div>
<div id="toast" class="toast hidden" role="status"></div><script src="/claim.js"></script></body></html>
