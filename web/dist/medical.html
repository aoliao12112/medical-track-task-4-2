<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>医疗复核工作台 · 医护洞察与温度指引平台</title><link rel="stylesheet" href="/portal.css"></head><body>
<div class="app-shell"><aside class="sidebar"><div class="brand-mark"><div class="brand-icon">＋</div><div class="brand-copy"><h1>医护洞察</h1><small>医疗复核工作区</small></div></div><nav>
<button class="nav-item active" data-view="home">⌂ <span class="nav-label">首页</span></button><button class="nav-item" data-view="pending">✓ <span class="nav-label">待复核案件</span></button><button class="nav-item" data-view="cases">▤ <span class="nav-label">我的案件</span></button><button class="nav-item" data-view="profile">○ <span class="nav-label">个人信息</span></button>
</nav></aside><div class="main-shell"><header class="topbar"><h2 id="topTitle">医疗复核工作台</h2><div class="user-box"><div class="user-copy"><strong id="userName">—</strong><small>医疗复核人员</small></div><button id="logoutButton" class="btn secondary">退出登录</button></div></header><main id="content" class="content"></main></div></div>
<div id="fieldReviewDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true"><div class="dialog field-review-dialog"><h2 id="fieldReviewTitle">字段复核</h2><p id="fieldReviewModel" class="muted"></p><div id="fieldReviewValueWrap" class="form-field hidden"><label for="fieldReviewValue">人工确认值</label><input id="fieldReviewValue" class="input" maxlength="1000"></div><div id="fieldReviewReasonWrap" class="form-field hidden"><label for="fieldReviewReason">复核说明</label><textarea id="fieldReviewReason" class="input textarea" maxlength="2000"></textarea></div><p id="fieldReviewError" class="form-error"></p><div class="dialog-actions"><button id="cancelFieldReview" class="btn secondary">取消</button><button id="saveFieldReview" class="btn primary">保存</button></div></div></div>
<div id="sourceDialog" class="dialog-backdrop hidden" role="dialog" aria-modal="true"><div class="dialog source-dialog"><div class="section-title"><h2 id="sourceDialogTitle">查看来源</h2><button id="closeSourceDialog" class="btn secondary">关闭</button></div><div id="sourceDialogBody" class="source-split"></div></div></div>
<div id="toast" class="toast hidden" role="status"></div><script src="/medical.js"></script></body></html>
